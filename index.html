<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="荷塘月色 · 一方青瓷池塘。投喂锦鲤，看萤火与月色。" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>" />
    <title>荷塘月色 · Moonlotus Pond</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1a1c; }
      #pond { position: fixed; inset: 0; z-index: 0; }
      #pond canvas { position: absolute; inset: 0; }
      .ui {
        position: fixed; z-index: 10;
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        color: #22423c; user-select: none;
      }
      .brand { top: 18px; left: 22px; pointer-events: none; }
      .brand h1 {
        display: inline-block; font-size: 17px; font-weight: 600; letter-spacing: 6px;
        padding: 7px 14px 7px 20px; border-radius: 999px;
        background: rgba(240, 247, 243, 0.66); backdrop-filter: blur(6px);
        box-shadow: 0 1px 8px rgba(20, 60, 50, 0.12);
      }
      .brand small { display: block; margin: 6px 0 0 12px; font-size: 9px; letter-spacing: 2.5px; color: rgba(34, 66, 60, 0.55); }
      .panel { top: 18px; right: 18px; display: flex; flex-direction: column; gap: 7px; align-items: flex-end; }
      .panel button {
        font: inherit; font-size: 12.5px; letter-spacing: 1px; cursor: pointer;
        padding: 6px 13px; border: none; border-radius: 999px;
        background: rgba(240, 247, 243, 0.66); backdrop-filter: blur(6px); color: #22423c;
        box-shadow: 0 1px 8px rgba(20, 60, 50, 0.12); transition: background 0.15s;
      }
      .panel button:hover { background: rgba(255, 255, 255, 0.85); }
      .hint {
        bottom: 16px; left: 50%; transform: translateX(-50%);
        font-size: 11.5px; letter-spacing: 2px; color: rgba(240, 248, 244, 0.75);
        text-shadow: 0 1px 6px rgba(10, 30, 30, 0.5); pointer-events: none;
      }
      #fps { bottom: 14px; right: 16px; font-size: 10px; color: rgba(240, 248, 244, 0.45); pointer-events: none; }
      #loading {
        position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(#0f2024, #16302f); color: #bcd8ce; font-size: 14px; letter-spacing: 8px;
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; transition: opacity 0.6s;
      }
    </style>
  </head>
  <body>
    <div id="pond"></div>
    <div class="ui brand"><h1>荷塘月色</h1><small>MOONLOTUS POND · M1</small></div>
    <div class="ui panel">
      <button id="btn-add">＋ 锦鲤</button>
      <button id="btn-water">水面 · 模拟</button>
      <button id="btn-eco">性能 · 流畅</button>
    </div>
    <div class="ui hint">轻点投喂 · 双击惊鱼 · 鱼跃有时 · 夜有萤火</div>
    <div class="ui" id="fps"></div>
    <div id="loading">注 水 中</div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
